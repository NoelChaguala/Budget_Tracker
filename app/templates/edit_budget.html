{% extends "base.html" %}

{% block title %}Edit Budget — Budget Tracker{% endblock %}

{% block content %}
<div class="dashboard-content">
  <div>
    <h1 class="page-title">Edit Budget</h1>
    <p class="page-subtitle">{{ budget.category.name }} · {{ budget.month.strftime('%B %Y') }}</p>
  </div>

  <section class="dashboard-card" style="max-width: 480px;">
    <form method="POST" action="{{ url_for('main.edit_budget', budget_id=budget.budget_id) }}">

      <div class="form-group">
        <label class="field-label">Category</label>
        <p style="font-weight: 700; font-size: 0.95rem; margin: 0;">{{ budget.category.name }}</p>
        <span class="form-hint">Category cannot be changed after creation.</span>
      </div>

      <div class="form-group">
        <label for="month">Month</label>
        <input type="month" id="month" name="month" required
               value="{{ budget.month.strftime('%Y-%m') }}">
      </div>

      <div class="form-group">
        <label for="amount_limit">Monthly limit</label>
        <input type="number" id="amount_limit" name="amount_limit"
               step="0.01" min="0.01" required
               class="amount-input"
               value="{{ budget.limit_amount }}">
      </div>

      <div class="form-group">
        <label for="description">
          Description <span class="form-hint" style="display: inline;">— optional</span>
        </label>
        <input type="text" id="description" name="description"
               placeholder="e.g. Monthly grocery allowance"
               value="{{ budget.description or '' }}">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Update budget</button>
        <a href="{{ url_for('main.view_budgets') }}" class="btn-secondary">Cancel</a>
      </div>

    </form>

    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line);">
      <form method="POST"
            action="{{ url_for('main.delete_budget', budget_id=budget.budget_id) }}"
            onsubmit="return confirm('Delete this budget? This cannot be undone.')">
        <button type="submit" class="btn-danger">Delete budget</button>
      </form>
    </div>

  </section>
</div>
{% endblock %}
