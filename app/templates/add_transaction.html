{% extends "base.html" %}

{% block title %}Add Transaction — Budget Tracker{% endblock %}

{% block content %}
<h1 class="page-title">Add Transaction</h1>

<div class="card" style="max-width: 420px;">
  <form method="POST">
    <div class="form-group">
      <label for="amount">Amount:</label>
      <input type="number" step="0.01" name="amount" id="amount" required>
    </div>
    <div class="form-group">
      <label for="description">Description:</label>
      <input type="text" name="description" id="description" required>
    </div>
    <div class="form-group">
      <label for="type">Type:</label>
      <select name="type" id="type" required>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
    </div>
<div class="form-group">
      <label for="category">Category:</label>
      <select name="category" id="category" required>
        <option value="">-- Select Category --</option>
        {% for cat in allowed_categories %}
        <option value="{{ cat.category_id }}">
          {% if cat.parent_id %}
          {{ cat.parent.name }} > {{ cat.name }}
          {% else %}
          {{ cat.name }}
          {% endif %}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="household_id">Assign To:</label>
      <select name="household_id" id="household_id">
        <option value="">Personal</option>
        {% for household in current_user.households %}
        <option value="{{ household.household_id }}">{{ household.name }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn-login">Add Transaction</button>
  </form>
</div>
{% endblock %}
