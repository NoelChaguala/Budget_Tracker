{% extends "base.html" %}

{% block title %}Edit Transaction — Budget Tracker{% endblock %}

{% block content %}
<h1 class="page-title">Edit Transaction</h1>

<div class="card">
  <form method="POST" action="{{ url_for('main.edit_transaction', transaction_id=transaction.transaction_id) }}">
    <div class="form-group">
      <label for="amount">Amount</label>
      <input type="number" step="0.01" name="amount" id="amount" value="{{ transaction.amount }}" required>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <input type="text" name="description" id="description" value="{{ transaction.description or '' }}">
    </div>

    <div class="form-group">
      <label for="type">Type</label>
      <select name="type" id="type" required>
        <option value="income" {% if transaction.type == 'income' %}selected{% endif %}>Income</option>
        <option value="expense" {% if transaction.type == 'expense' %}selected{% endif %}>Expense</option>
      </select>
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" name="date" id="date" value="{{ transaction.date.strftime('%Y-%m-%d') if transaction.date else '' }}" required>
    </div>

    <div class="form-group">
      <label for="category_id">Category</label>
      <select name="category_id" id="category_id" required>
        {% for category in allowed_categories %}
          <option value="{{ category.category_id }}" {% if transaction.category_id == category.category_id %}selected{% endif %}>{{ category.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-login">Update Transaction</button>
      <a href="{{ url_for('main.personal_dashboard' if not transaction.household_id else 'main.household_dashboard', household_id=transaction.household_id) }}" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_css %}
<style>
.form-actions {
  display: flex;
  gap: 1rem;
  margin-top: 1rem;
}

.btn-cancel {
  padding: 0.5rem 1rem;
  background: #6b7280;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-weight: 600;
  transition: background 0.2s;
}

.btn-cancel:hover {
  background: #4b5563;
}
</style>
{% endblock %}
