{% extends "base.html" %}

{% block title %}Edit Transaction — Budget Tracker{% endblock %}

{% block content %}
<div class="dashboard-content">
  <div>
    <h1 class="page-title">Edit Transaction</h1>
    <p class="page-subtitle">Update the details of this transaction.</p>
  </div>

  <section class="dashboard-card" style="max-width: 480px;">
    <form method="POST" action="{{ url_for('main.edit_transaction', transaction_id=transaction.transaction_id) }}" id="edit-form">

      <div class="form-group">
        <label>Amount</label>
        <input type="number" step="0.01" name="amount" id="amount"
               class="amount-input" placeholder="0.00"
               value="{{ transaction.amount }}" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <input type="text" name="description" id="description"
               placeholder="What was this for?"
               value="{{ transaction.description or '' }}">
      </div>

      <div class="form-group">
        <label>Type</label>
        <div class="chip-row" id="type-toggle">
          <button type="button" class="chip {% if transaction.type == 'expense' %}is-selected{% endif %}" data-type="expense">Expense</button>
          <button type="button" class="chip {% if transaction.type == 'income' %}is-selected{% endif %}" data-type="income">Income</button>
          <input type="hidden" name="type" id="type-input" value="{{ transaction.type }}">
        </div>
      </div>

      <div class="form-group">
        <label for="date">Date</label>
        <input type="date" name="date" id="date"
               value="{{ transaction.date.strftime('%Y-%m-%d') if transaction.date else '' }}"
               required>
      </div>

      <div class="form-group">
        <label for="category_id">Category</label>
        <select name="category_id" id="category_id" required>
          <option value="" disabled>Select a category</option>
          {% for cat in allowed_categories %}
          <option value="{{ cat.category_id }}"
                  {% if transaction.category_id == cat.category_id %}selected{% endif %}>
            {{ cat.name }}
          </option>
          {% endfor %}
        </select>
        <span class="form-hint">
          Category missing?
          <button type="button" class="inline-link" id="show-new-cat">Add one</button>
        </span>
        <div id="new-cat-row" style="display: none; margin-top: 8px; gap: 8px; align-items: center;">
          <input type="text" id="new-cat-name" placeholder="Category name" style="flex: 1;">
          <button type="button" class="btn-secondary" id="save-new-cat">Save</button>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Update transaction</button>
        <a href="{{ url_for('main.personal_dashboard') if not transaction.household_id else url_for('main.household_dashboard', household_id=transaction.household_id) }}"
           class="btn-secondary">Cancel</a>
      </div>

    </form>
  </section>
</div>
{% endblock %}

{% block extra_js %}
<script>
(() => {
  // --- Type chips ---
  const typeInput = document.getElementById('type-input');
  document.getElementById('type-toggle').addEventListener('click', e => {
    const chip = e.target.closest('[data-type]');
    if (!chip) return;
    typeInput.value = chip.dataset.type;
    document.querySelectorAll('#type-toggle .chip').forEach(c =>
      c.classList.toggle('is-selected', c === chip)
    );
  });

  // --- Inline category creation ---
  const categorySelect = document.getElementById('category_id');
  const showBtn = document.getElementById('show-new-cat');
  const newCatRow = document.getElementById('new-cat-row');
  const newCatName = document.getElementById('new-cat-name');
  const saveCatBtn = document.getElementById('save-new-cat');
  const inlineUrl = {{ url_for('categories.create_category_inline') | tojson }};

  // Determine scope from the transaction's household assignment
  const scope = "{{ transaction.household_id or 'personal' }}";

  showBtn.addEventListener('click', () => {
    newCatRow.style.display = 'flex';
    newCatName.focus();
  });

  saveCatBtn.addEventListener('click', async () => {
    const name = newCatName.value.trim();
    if (!name) return;

    const res = await fetch(inlineUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, scope }),
    });

    if (!res.ok) return;
    const cat = await res.json();

    if (!categorySelect.querySelector(`option[value="${cat.id}"]`)) {
      const opt = new Option(cat.name, String(cat.id));
      categorySelect.appendChild(opt);
    }
    categorySelect.value = String(cat.id);

    newCatName.value = '';
    newCatRow.style.display = 'none';
  });
})();
</script>
{% endblock %}
